<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Roster - SWGOH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } } } }
    </script>
    <!-- Tom Select CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <!-- Thème Sombre & Ajustement Largeur pour Tom Select -->
    <style>
        .ts-wrapper {
            width: 100% !important;
        }
        .ts-control {
            background-color: #0f172a !important; /* slate-900 */
            border-color: #334155 !important;     /* slate-700 */
            color: #f1f5f9 !important;          /* slate-100 */
            border-radius: 0.75rem !important;    /* rounded-xl */
            padding: 0.625rem 1rem !important;
            font-size: 0.875rem !important;
            width: 100% !important;
        }
        .ts-dropdown {
            background-color: #1e293b !important; /* slate-800 */
            border-color: #334155 !important;
            color: #f1f5f9 !important;
            border-radius: 0.75rem !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
        }
        .ts-dropdown .option {
            color: #cbd5e1 !important;          /* slate-300 */
            padding: 8px 12px !important;
        }
        .ts-dropdown .option.active, .ts-dropdown .option:hover {
            background-color: #f59e0b !important; /* amber-500 */
            color: #020617 !important;          /* slate-950 */
        }
        .ts-control input {
            color: #f1f5f9 !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8 max-w-7xl">
        <!-- En-tête -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-6 shadow-xl">
            <h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-search text-amber-400"></i> Analyse du Roster
            </h1>
        </div>

        <!-- Onglets -->
        <div class="border-b border-slate-700 mb-8 flex gap-6 text-sm font-semibold">
            <button id="btn-tab-omicron" onclick="switchTab('omicron')" 
                    class="pb-3 flex items-center gap-2 border-b-2 transition-colors focus:outline-none">
                <i class="bi bi-star-half text-base"></i> Recherche Omicrons
            </button>
            <button id="btn-tab-relic" onclick="switchTab('relic')" 
                    class="pb-3 flex items-center gap-2 border-b-2 transition-colors focus:outline-none">
                <i class="bi bi-shield-shaded text-base"></i> Recherche Reliques
            </button>
        </div>

        <!-- ONGLET 1 : OMICRON -->
        <div id="tab-omicron" class="space-y-6 hidden">
            
            <!-- Formulaire de recherche -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="bi bi-funnel text-amber-400"></i> Sélection des Unités et Omicrons
                </h2>
                
                <form action="/analyse-roster" method="get" class="space-y-4">
                    <input type="hidden" name="activeTab" value="omicron" />
                    
                    <div th:each="i : ${#numbers.sequence(1, 5)}" class="flex flex-col md:flex-row gap-4 items-center bg-slate-850 p-3 rounded-xl border border-slate-700/50">
                        <span class="font-bold text-slate-400 w-6 text-center" th:text="${i}"></span>
                        
                        <!-- Select Unité (Tom Select avec conteneur de largeur fixe) -->
                        <div class="w-full md:w-1/4">
                            <select th:id="'unit-select-' + ${i}" th:data-row="${i}"
                                    class="tom-select-omicron" placeholder="Sélectionner une unité">
                                <option value="">Sélectionner une unité</option>
                                <option th:each="unit : ${referentielOmicrons}" th:value="${unit.baseId}" th:text="${unit.unitName}"></option>
                            </select>
                        </div>

                        <!-- Selects Skills (max 3) -->
                        <select th:id="'skill-select-' + ${i} + '-1'" name="skillIds" disabled
                                class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-400 focus:border-amber-500 w-full md:w-1/4">
                            <option value="">-- Omicron 1 --</option>
                        </select>
                        <select th:id="'skill-select-' + ${i} + '-2'" name="skillIds" disabled
                                class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-400 focus:border-amber-500 w-full md:w-1/4">
                            <option value="">-- Omicron 2 --</option>
                        </select>
                        <select th:id="'skill-select-' + ${i} + '-3'" name="skillIds" disabled
                                class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-400 focus:border-amber-500 w-full md:w-1/4">
                            <option value="">-- Omicron 3 --</option>
                        </select>
                    </div>

                    <div class="mt-4 flex justify-end">
                        <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-6 rounded-xl transition-colors shadow-lg flex items-center gap-2 text-sm">
                            <i class="bi bi-search"></i> Analyser Omicrons
                        </button>
                    </div>
                </form>
            </div>

            <!-- Résultats Omicrons -->
            <div th:if="${resultats != null}" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
                <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="bi bi-table text-amber-400"></i> Matrice des résultats
                    </h2>
                </div>
                
                <div class="overflow-x-auto p-4">
                    <table id="omicronTable" class="w-full text-center text-sm text-slate-300 whitespace-nowrap border-collapse">
                        <thead class="bg-slate-850 text-slate-400 uppercase text-xs font-semibold border-b border-slate-700 select-none">
                            <tr>
                                <th rowspan="2" onclick="sortTable('omicronTable', 0, 'text')" 
                                    class="px-4 py-3 text-left sticky left-0 bg-slate-850 z-10 shadow-[1px_0_0_0_#334155] align-middle cursor-pointer hover:text-amber-400 transition-colors">
                                    Joueur <i class="bi bi-arrow-down-up ms-1 text-xs opacity-60"></i>
                                </th>
                                <th rowspan="2" onclick="sortTable('omicronTable', 1, 'number')" 
                                    class="px-4 py-3 shadow-[1px_0_0_0_#334155] align-middle cursor-pointer hover:text-amber-400 transition-colors">
                                    % Total <i class="bi bi-arrow-down-up ms-1 text-xs opacity-60"></i>
                                </th>
                                
                                <th th:each="uHeader : ${headersRecherches}" 
                                    th:colspan="${#lists.size(uHeader.skills)}" 
                                    class="px-4 py-2 text-white font-bold text-xs border-l border-slate-700 bg-slate-800/80">
                                    <span th:text="${uHeader.unitName}"></span>
                                </th>
                            </tr>

                            <tr class="border-t border-slate-700/50">
                                <th:block th:each="uHeader : ${headersRecherches}">
                                    <th th:each="skill, iterStat : ${uHeader.skills}" 
                                        th:classappend="${iterStat.first} ? 'border-l border-slate-700' : ''"
                                        class="px-3 py-1.5 text-amber-400 font-mono text-[10px] bg-slate-850">
                                        <span th:text="${skill.skillType}"></span>
                                    </th>
                                </th:block>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/60">
                            <tr th:each="row : ${resultats}" class="hover:bg-slate-850/50 transition-colors">
                                <td class="px-4 py-3 font-bold text-white text-left sticky left-0 bg-slate-800 shadow-[1px_0_0_0_#334155]" 
                                    th:data-sort="${row.playerName}" 
                                    th:text="${row.playerName}"></td>
                                <td class="px-4 py-3 shadow-[1px_0_0_0_#334155]" 
                                    th:data-sort="${row.pourcentageActif}">
                                    <span th:classappend="${row.pourcentageActif >= 100} ? 'text-green-400 font-bold' : (${row.pourcentageActif > 0} ? 'text-amber-400' : 'text-slate-500')"
                                          th:text="${#numbers.formatDecimal(row.pourcentageActif, 1, 0)} + ' %'"></span>
                                </td>
                                
                                <th:block th:each="uHeader : ${headersRecherches}">
                                    <td th:each="skill, iterStat : ${uHeader.skills}" 
                                        th:classappend="${iterStat.first} ? 'border-l border-slate-700' : ''"
                                        class="px-4 py-3 text-center">
                                        <i th:if="${row.omicronsPossedes.get(skill.skillId)}" class="bi bi-check-lg text-green-500 text-xl drop-shadow-md"></i>
                                        <i th:unless="${row.omicronsPossedes.get(skill.skillId)}" class="bi bi-x-lg text-red-500/80 text-lg"></i>
                                    </td>
                                </th:block>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

        <!-- ONGLET 2 : RELIC -->
        <div id="tab-relic" class="space-y-6 hidden">
            
            <!-- Formulaire de recherche Relic -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="bi bi-funnel text-amber-400"></i> Sélection des Unités et Niveaux de Relique
                </h2>
                
                <form action="/analyse-roster" method="get" class="space-y-4">
                    <input type="hidden" name="activeTab" value="relic" />
                    
                    <div th:each="i : ${#numbers.sequence(1, 5)}" class="flex flex-col md:flex-row gap-4 items-center bg-slate-850 p-3 rounded-xl border border-slate-700/50">
                        <span class="font-bold text-slate-400 w-6 text-center" th:text="${i}"></span>
                        
                        <!-- Select Unité (Tom Select avec conteneur de largeur fixe) -->
                        <div class="w-full md:w-1/2">
                            <select th:id="'relicUnitSelect-' + ${i}" name="relicBaseIds" class="tom-select-relic" placeholder="Sélectionner une unité">
                                <option value="">Sélectionner une unité</option>
                                <option th:each="unit : ${toutesLesUnites}" 
                                        th:value="${unit.baseId}" 
                                        th:text="${unit.libelle}">
                                </option>
                            </select>
                        </div>

                        <!-- Select Niveau Relic (0 à 10) -->
                        <select name="targetRelics"
                                class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:border-amber-500 w-full md:w-1/2">
                            <option value="">-- Niveau de rélique cible --</option>
                            <option th:each="r : ${#numbers.sequence(0, 10)}" 
                                    th:value="${r}" 
                                    th:text="${r == 0 ? 'R0 (G13)' : 'Relic ' + r}">
                            </option>
                        </select>
                    </div>

                    <div class="mt-4 flex justify-end">
                        <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-6 rounded-xl transition-colors shadow-lg flex items-center gap-2 text-sm">
                            <i class="bi bi-search"></i> Analyser Reliques
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tableau Résultats Relic -->
            <div th:if="${resultatsRelics != null}" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
                <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="bi bi-table text-amber-400"></i> Matrice des réliques
                    </h2>
                </div>
                
                <div class="overflow-x-auto p-4">
                    <table id="relicTable" class="w-full text-center text-sm text-slate-300 whitespace-nowrap border-collapse">
                        <thead class="bg-slate-850 text-slate-400 uppercase text-xs font-semibold border-b border-slate-700 select-none">
                            <tr>
                                <th onclick="sortTable('relicTable', 0, 'text')" 
                                    class="px-4 py-3 text-left sticky left-0 bg-slate-850 z-10 shadow-[1px_0_0_0_#334155] cursor-pointer hover:text-amber-400 transition-colors">
                                    Joueur <i class="bi bi-arrow-down-up ms-1 text-xs opacity-60"></i>
                                </th>
                                <th onclick="sortTable('relicTable', 1, 'number')" 
                                    class="px-4 py-3 shadow-[1px_0_0_0_#334155] cursor-pointer hover:text-amber-400 transition-colors">
                                    % Objectif <i class="bi bi-arrow-down-up ms-1 text-xs opacity-60"></i>
                                </th>
                                
                                <th th:each="rHeader : ${relicHeaders}" class="px-4 py-3 border-l border-slate-700/50">
                                    <span class="block text-white font-bold text-xs" th:text="${rHeader.unitName}"></span>
                                    <span class="block text-amber-400 font-mono text-[10px]" th:text="'Cible: R' + ${rHeader.targetRelic}"></span>
                                </th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/60">
                            <tr th:each="row : ${resultatsRelics}" class="hover:bg-slate-850/50 transition-colors">
                                <td class="px-4 py-3 font-bold text-white text-left sticky left-0 bg-slate-800 shadow-[1px_0_0_0_#334155]" 
                                    th:data-sort="${row.playerName}" 
                                    th:text="${row.playerName}"></td>
                                <td class="px-4 py-3 shadow-[1px_0_0_0_#334155]" 
                                    th:data-sort="${row.pourcentageActif}">
                                    <span th:classappend="${row.pourcentageActif >= 100} ? 'text-green-400 font-bold' : (${row.pourcentageActif > 0} ? 'text-amber-400' : 'text-slate-500')"
                                          th:text="${#numbers.formatDecimal(row.pourcentageActif, 1, 0)} + ' %'"></span>
                                </td>
                                
                                <td th:each="rHeader : ${relicHeaders}" class="px-4 py-3 border-l border-slate-700/50 text-center">
                                    <span th:with="relicVal=${row.relicsPossedes.get(rHeader.baseId)}, isOk=${row.objectifsAtteints.get(rHeader.baseId)}"
                                          th:classappend="${isOk} ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-red-500/10 text-red-400 border-red-500/20'"
                                          class="px-2.5 py-1 rounded-md text-xs font-bold border font-mono">
                                        <th:block th:text="${relicVal != null && relicVal >= 0 ? 'R' + relicVal : '< G13'}"></th:block>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Script de gestion dynamique -->
    <script th:inline="javascript">
        const referentiel = /*[[${referentielOmicrons}]]*/ [];

        // Trier le référentiel JavaScript par nom d'unité
        if (referentiel && referentiel.length) {
            referentiel.sort((a, b) => a.unitName.localeCompare(b.unitName, 'fr', { sensitivity: 'base' }));
        }

        // Mise à jour des compétences Omicron lors de la sélection d'une unité
        function updateSkills(selectElement) {
            const rowId = selectElement.getAttribute('data-row');
            const baseId = selectElement.value;
            
            const unit = referentiel.find(u => u.baseId === baseId);
            const skills = unit ? unit.skills : [];

            for (let i = 1; i <= 3; i++) {
                const skillSelect = document.getElementById(`skill-select-${rowId}-${i}`);
                skillSelect.innerHTML = `<option value="">-- Omicron ${i} --</option>`;
                
                if (skills.length >= i) {
                    const skill = skills[i - 1];
                    const option = document.createElement('option');
                    option.value = skill.idSkill;
                    
                    const typeCapitalized = skill.skillType 
                        ? skill.skillType.charAt(0).toUpperCase() + skill.skillType.slice(1) 
                        : '';

                    if (skill.numero !== null && skill.numero !== undefined) {
                        option.text = typeCapitalized + ' ' + skill.numero;
                    } else {
                        option.text = typeCapitalized;
                    }

                    skillSelect.appendChild(option);
                    skillSelect.disabled = false;
                    skillSelect.classList.remove('text-slate-400');
                    skillSelect.classList.add('text-slate-100');
                } else {
                    skillSelect.disabled = true;
                    skillSelect.classList.add('text-slate-400');
                    skillSelect.classList.remove('text-slate-100');
                }
            }
        }

        // Changement d'onglet
        function switchTab(tabName) {
            document.getElementById('tab-omicron').classList.add('hidden');
            document.getElementById('tab-relic').classList.add('hidden');
            
            document.getElementById('btn-tab-omicron').className = "pb-3 flex items-center gap-2 border-b-2 transition-colors focus:outline-none border-transparent text-slate-400 hover:text-slate-200";
            document.getElementById('btn-tab-relic').className = "pb-3 flex items-center gap-2 border-b-2 transition-colors focus:outline-none border-transparent text-slate-400 hover:text-slate-200";

            const targetTab = document.getElementById(`tab-${tabName}`);
            const targetBtn = document.getElementById(`btn-tab-${tabName}`);

            if (targetTab && targetBtn) {
                targetTab.classList.remove('hidden');
                targetBtn.className = "pb-3 flex items-center gap-2 border-b-2 transition-colors focus:outline-none border-amber-400 text-amber-400 font-bold";
            }
        }

        // Tri générique des tableaux
        const sortDirections = {};
        function sortTable(tableId, columnIndex, type) {
            const table = document.getElementById(tableId);
            if (!table) return;

            const tbody = table.querySelector("tbody");
            if (!tbody) return;

            const rows = Array.from(tbody.querySelectorAll("tr"));
            const sortKey = `${tableId}-${columnIndex}`;
            sortDirections[sortKey] = !sortDirections[sortKey];
            const asc = sortDirections[sortKey];

            rows.sort((a, b) => {
                const cellA = a.children[columnIndex];
                const cellB = b.children[columnIndex];

                let valA = cellA ? (cellA.getAttribute("data-sort") || cellA.innerText.trim()) : '';
                let valB = cellB ? (cellB.getAttribute("data-sort") || cellB.innerText.trim()) : '';

                if (type === 'number') {
                    let numA = parseFloat(valA);
                    let numB = parseFloat(valB);
                    if (isNaN(numA)) numA = -1;
                    if (isNaN(numB)) numB = -1;
                    return asc ? numA - numB : numB - numA;
                } else {
                    return asc 
                        ? valA.localeCompare(valB, 'fr', { sensitivity: 'base' })
                        : valB.localeCompare(valA, 'fr', { sensitivity: 'base' });
                }
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        // Initialisations générales au chargement du DOM
        document.addEventListener("DOMContentLoaded", () => {
            // Gestion de l'onglet actif
            const activeTabFromSpring = /*[[${activeTab}]]*/ 'omicron';
            switchTab(activeTabFromSpring || 'omicron');

            // Tom Select : Onglet Omicrons
            document.querySelectorAll(".tom-select-omicron").forEach(select => {
                new TomSelect(select, {
                    create: false,
                    maxOptions: null,
                    allowEmptyOption: true,
                    placeholder: "Sélectionner une unité",
                    sortField: { field: "text", direction: "asc" },
                    onChange: function() {
                        updateSkills(select);
                    }
                });
            });

            // Tom Select : Onglet Reliques
            document.querySelectorAll(".tom-select-relic").forEach(select => {
                new TomSelect(select, {
                    create: false,
                    maxOptions: null,
                    allowEmptyOption: true,
                    placeholder: "Sélectionner une unité",
                    sortField: { field: "text", direction: "asc" }
                });
            });
        });
    </script>
</body>
</html>
