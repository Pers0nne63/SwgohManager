services:
  postgres:
    image: postgres:16
    container_name: swgoh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swgoh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - swgoh_pgdata:/var/lib/postgresql/data

volumes:
  swgoh_pgdata: