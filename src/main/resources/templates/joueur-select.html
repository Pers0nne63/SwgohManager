<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélection joueur - SwgohManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { 
                    colors: { 
                        slate: { 850: '#152032', 950: '#0b1329' } 
                    } 
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Navigation -->
    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-12 flex flex-col justify-center items-center">
        
        <div class="w-full max-w-md">

            <!-- Card de sélection -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 text-3xl mb-4 shadow-inner">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-white">Fiche Joueur</h1>
                    <p class="text-slate-400 text-sm mt-1">Sélectionnez un membre de la guilde pour consulter ses statistiques et son roster.</p>
                </div>

                <div class="space-y-3">
                    <label for="selectJoueur" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        Choisir un joueur
                    </label>
                    <div class="relative">
                        <select id="selectJoueur" 
                                onchange="if(this.value) window.location.href='/joueur/' + this.value;"
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 text-sm appearance-none cursor-pointer transition-colors">
                            <option value="" disabled selected>-- Sélectionner un joueur --</option>
                            <option th:each="j : ${joueurs}" th:value="${j.playerId}" th:text="${j.playerName}"></option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                            <i class="bi bi-chevron-down"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
