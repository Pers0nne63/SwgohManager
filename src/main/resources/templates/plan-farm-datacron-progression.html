<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Plan de Farm Datacron</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } } }
        }
    </script>

    <style>
        summary { cursor: pointer; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        summary .chevron { transition: transform 0.2s; }
        details[open] > summary .chevron { transform: rotate(90deg); }

        .badge-pct {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            padding: 2px 10px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .badge-pct.high { background-color: rgba(34, 197, 94, 0.12); color: #4ade80; }
        .badge-pct.mid { background-color: rgba(245, 158, 11, 0.12); color: #fbbf24; }
        .badge-pct.low { background-color: rgba(239, 68, 68, 0.12); color: #f87171; }

        .bar-bg {
            background-color: rgba(255,255,255,0.05);
            border-radius: 9999px;
            overflow: hidden;
            height: 6px;
        }
        .bar-fill { height: 100%; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 lg:px-8 py-8 max-w-5xl">

        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50">
            <h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-bar-chart-fill text-amber-400"></i>
                <span>Suivi Plan de Farm Datacron</span>
            </h1>
            <a href="/web/plan-farm-datacron"
               class="inline-flex items-center space-x-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl font-semibold text-sm transition-all duration-200">
                <i class="bi bi-gear"></i>
                <span>Gérer les cibles</span>
            </a>
        </div>

        <div th:if="${#lists.isEmpty(sets)}" class="text-center py-20 text-slate-500">
            <i class="bi bi-inbox text-4xl mb-3 block"></i>
            Aucun objectif de datacron défini, ou aucun joueur actif dans la guilde.
        </div>

        <div th:if="${!#lists.isEmpty(sets)}" class="space-y-4">

            <details th:each="set : ${sets}" class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden">
                <summary class="flex items-center justify-between px-5 py-4 hover:bg-slate-700/30 transition-colors">
                    <div class="flex items-center gap-3">
                        <i class="bi bi-chevron-right chevron text-slate-400"></i>
                        <span class="text-base font-bold text-white" th:text="'SET ' + ${set.setId}"></span>
                        <span class="text-xs text-slate-500" th:text="${set.joueursAtteint} + ' / ' + ${set.totalJoueurs} + ' joueurs conformes'"></span>
                    </div>
                    <span class="badge-pct"
                          th:classappend="${set.pourcentage >= 80} ? 'high' : (${set.pourcentage >= 50} ? 'mid' : 'low')"
                          th:text="${#numbers.formatDecimal(set.pourcentage, 1, 1)} + ' %'"></span>
                </summary>

                <div class="border-t border-slate-700 px-5 py-4 space-y-3">
                    <div th:if="${#lists.isEmpty(set.datacrons)}" class="text-slate-500 text-sm">
                        Aucun datacron cible pour ce set.
                    </div>

                    <details th:each="dtc : ${set.datacrons}" class="bg-slate-850 border border-slate-700/60 rounded-xl overflow-hidden">
                        <summary class="flex items-center justify-between px-4 py-3 hover:bg-slate-700/20 transition-colors">
                            <div class="flex items-center gap-2">
                                <i class="bi bi-chevron-right chevron text-slate-500 text-sm"></i>
                                <span class="text-sm font-semibold text-slate-200" th:text="${dtc.nom}"></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <a th:href="@{/web/plan-farm-datacron/progression/datacron/{id}(id=${dtc.id})}"
                                   class="text-xs text-amber-400 hover:underline flex items-center gap-1"
                                   onclick="event.stopPropagation();">
                                    <i class="bi bi-people"></i> Détail joueurs
                                </a>
                                <span class="badge-pct text-xs"
                                      th:classappend="${dtc.pourcentage >= 80} ? 'high' : (${dtc.pourcentage >= 50} ? 'mid' : 'low')"
                                      th:text="${#numbers.formatDecimal(dtc.pourcentage, 1, 1)} + ' %'"></span>
                            </div>
                        </summary>

                        <div class="border-t border-slate-700/60 px-4 py-3 space-y-4">

                            <div th:if="${!#lists.isEmpty(dtc.mecaniques)}">
                                <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Mécaniques</h4>
                                <div class="space-y-2">
                                    <div th:each="mec : ${dtc.mecaniques}" class="flex items-center gap-3">
                                        <span class="inline-flex items-center justify-center w-6 h-6 rounded bg-amber-500/10 text-amber-400 font-bold text-[10px] shrink-0"
                                              th:text="${mec.tier}"></span>
                                        <div class="flex-1 min-w-0">
                                            <p class="text-xs text-slate-300 truncate" th:text="${mec.description}" th:title="${mec.description}"></p>
                                            <div class="bar-bg mt-1">
                                                <div class="bar-fill"
                                                     th:style="'width:' + ${mec.pourcentage} + '%; background-color:' + (${mec.pourcentage >= 80} ? '#4ade80' : (${mec.pourcentage >= 50} ? '#fbbf24' : '#f87171'))"></div>
                                            </div>
                                        </div>
                                        <span class="text-xs font-mono text-slate-400 shrink-0" th:text="${#numbers.formatDecimal(mec.pourcentage, 1, 1)} + ' %'"></span>
                                    </div>
                                </div>
                            </div>

                            <div th:if="${!#lists.isEmpty(dtc.stats)}">
                                <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Statistiques</h4>
                                <div class="space-y-2">
                                    <div th:each="stat : ${dtc.stats}" class="flex items-center gap-3">
                                        <div class="flex-1 min-w-0">
                                            <p class="text-xs text-slate-300 truncate"
                                               th:text="${stat.statLibelle} + ' (≥ ' + ${#numbers.formatDecimal(stat.valeurCible, 1, 2)} + ')'"></p>
                                            <div class="bar-bg mt-1">
                                                <div class="bar-fill"
                                                     th:style="'width:' + ${stat.pourcentage} + '%; background-color:' + (${stat.pourcentage >= 80} ? '#4ade80' : (${stat.pourcentage >= 50} ? '#fbbf24' : '#f87171'))"></div>
                                            </div>
                                        </div>
                                        <span class="text-xs font-mono text-slate-400 shrink-0" th:text="${#numbers.formatDecimal(stat.pourcentage, 1, 1)} + ' %'"></span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </details>
                </div>
            </details>

        </div>

    </main>

</body>
</html>
