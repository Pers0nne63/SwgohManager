<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Tom Select CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } }
            }
        }
    </script>

    <!-- Thème Sombre pour Tom Select -->
    <style>
        .ts-control {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
            border-radius: 0.5rem !important;
            padding: 0.375rem 0.75rem !important;
            font-size: 0.8125rem !important;
        }
        .ts-dropdown {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
            border-radius: 0.5rem !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
        }
        .ts-dropdown .option { color: #cbd5e1 !important; padding: 6px 10px !important; }
        .ts-dropdown .option.active, .ts-dropdown .option:hover {
            background-color: #f59e0b !important;
            color: #020617 !important;
        }
        .ts-control input { color: #f1f5f9 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-6 max-w-7xl">
        <a href="/guilde" class="inline-flex items-center text-xs font-medium text-slate-400 hover:text-amber-400 mb-4 transition-colors">
            <i class="bi bi-arrow-left me-2"></i> Retour à la guilde
        </a>

        <div class="flex justify-between items-center mb-5">
            <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <i class="bi bi-journal-check text-emerald-400"></i> Plan de Farm Global
            </h1>
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-bold">
                <span th:text="${#lists.size(plans)}">0</span> unités · <span th:text="${#maps.size(plansParTag)}">0</span> tags
            </span>
        </div>

        <!-- Formulaire d'ajout (compact, sur une ligne) -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-5 shadow-lg">
            <h2 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <i class="bi bi-plus-circle text-amber-400"></i> Ajouter une unité au plan
            </h2>
            <form th:action="@{/plan-farm/ajouter}" method="post" class="grid grid-cols-2 md:grid-cols-12 gap-3 items-end">
                <div class="col-span-2 md:col-span-5">
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Unité</label>
                    <select id="unitSelect" name="selection" required placeholder="Rechercher une unité...">
                        <option value="">Rechercher une unité...</option>
                        <option th:each="u : ${unites}" th:value="${u.libelle}" th:text="${u.libelle}"></option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Étoiles</label>
                    <select name="etoiles" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-100 focus:outline-none focus:border-amber-500 text-xs">
                        <option th:each="e : ${etoilesOptions}" th:value="${e}" th:text="${e}" th:selected="${e == 7}"></option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Relic</label>
                    <select name="relic" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-100 focus:outline-none focus:border-amber-500 text-xs">
                        <option th:each="r : ${relicOptions}" th:value="${r}" th:text="${r}" th:selected="${r == 6}"></option>
                    </select>
                </div>
                <div class="col-span-1 md:col-span-3">
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Tag</label>
                    <input type="text" name="tag" list="tagsExistants" autocomplete="off"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100 focus:outline-none focus:border-amber-500 text-xs"
                           placeholder="ex: GAC, TB..." />
                    <datalist id="tagsExistants">
                        <option th:each="t : ${tags}" th:value="${t}"></option>
                    </datalist>
                </div>
                <div class="col-span-1 md:col-span-2">
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 px-3 rounded-lg transition-colors shadow flex items-center justify-center gap-1.5 text-xs">
                        <i class="bi bi-plus-lg"></i> Ajouter
                    </button>
                </div>
            </form>
        </div>

        <!-- Cards : 1 par tag, 2 par ligne -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
            <div th:each="entry : ${plansParTag}"
                 class="bg-slate-800 border border-slate-700 rounded-xl shadow-lg overflow-hidden">

                <!-- En-tête de la card -->
                <div class="px-4 py-2.5 border-b border-slate-700 bg-slate-850 flex justify-between items-center">
                    <h2 class="text-sm font-bold text-white flex items-center gap-2">
                        <i class="bi bi-tag-fill text-amber-400 text-xs"></i>
                        <span th:text="${entry.key}">GAC</span>
                    </h2>
                    <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold"
                          th:text="${#lists.size(entry.value)}">0</span>
                </div>

                <!-- Légende des colonnes -->
                <div class="grid grid-cols-[1fr_3.5rem_3.5rem_5.5rem_4.25rem] gap-2 px-4 py-1.5 text-[9px] uppercase tracking-wider font-semibold text-slate-500 border-b border-slate-700/60">
                    <span>Unité</span>
                    <span>Étoiles</span>
                    <span>Relic</span>
                    <span>Tag</span>
                    <span class="text-center">Actions</span>
                </div>

                <!-- Lignes : un formulaire par unité (le bouton supprimer utilise formaction) -->
                <div class="divide-y divide-slate-700/60">
                    <form th:each="p : ${entry.value}"
                          th:action="@{/plan-farm/modifier/{id}(id=${p.id})}" method="post"
                          class="grid grid-cols-[1fr_3.5rem_3.5rem_5.5rem_4.25rem] gap-2 items-center px-4 py-1.5 hover:bg-slate-700/20 transition-colors">

                        <span class="text-xs font-bold text-white truncate" th:text="${p.nomUnite}" th:title="${p.nomUnite}"></span>

                        <select name="etoiles" class="bg-slate-900 border border-slate-700 rounded-md px-1 py-0.5 text-[11px] text-slate-200 w-full">
                            <option th:each="e : ${etoilesOptions}" th:value="${e}" th:text="${e}" th:selected="${e == p.etoilesCible}"></option>
                        </select>

                        <select name="relic" class="bg-slate-900 border border-slate-700 rounded-md px-1 py-0.5 text-[11px] text-slate-200 w-full">
                            <option th:each="r : ${relicOptions}" th:value="${r}" th:text="${r}" th:selected="${r == p.relicCible}"></option>
                        </select>

                        <input type="text" name="tag" list="tagsExistants" autocomplete="off"
                               class="bg-slate-900 border border-slate-700 rounded-md px-2 py-0.5 text-[11px] text-slate-200 w-full"
                               th:value="${p.tag}" />

                        <div class="flex items-center justify-center gap-1">
                            <button type="submit" title="Enregistrer"
                                    class="w-7 h-7 flex items-center justify-center bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600 hover:text-white rounded-md transition-colors border border-indigo-500/30 text-xs">
                                <i class="bi bi-check-lg"></i>
                            </button>
                            <button type="submit" title="Supprimer"
                                    th:formaction="@{/plan-farm/supprimer/{id}(id=${p.id})}" formmethod="post"
                                    onclick="return confirm('Supprimer cette unité du plan ?');"
                                    class="w-7 h-7 flex items-center justify-center bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-md transition-colors border border-red-500/30 text-xs">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Aucun plan -->
        <div th:if="${#maps.isEmpty(plansParTag)}" class="text-center text-slate-500 text-sm py-10">
            Aucune unité dans le plan pour le moment.
        </div>
    </main>

    <!-- Initialisation de Tom Select -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            new TomSelect("#unitSelect", {
                create: false,
                maxOptions: null,
                sortField: { field: "text", direction: "asc" }
            });
        });
    </script>
</body>
</html>
