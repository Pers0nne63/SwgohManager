<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plan de farm</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: center; }
        th { background: #f0f0f0; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        input[type=text], input[type=number], select { padding: 4px 6px; }
        .btn { padding: 5px 12px; cursor: pointer; }
        .btn-danger { background: #d73027; color: white; border: none; border-radius: 4px; }
        .btn-primary { background: #2a6cd6; color: white; border: none; border-radius: 4px; }
        a { color: #2a6cd6; text-decoration: none; }
    </style>
</head>
<body>
<p><a href="/guilde">&larr; Retour à la guilde</a></p>

<h1>Plan de farm</h1>

<div class="card">
    <h3>Ajouter une unité</h3>
    <form th:action="@{/plan-farm/ajouter}" method="post" style="display:flex; gap:10px; align-items:end; flex-wrap:wrap;">
        <div>
            <label>Unité</label><br>
            <input type="text" name="baseId" list="baseIdOptions" required placeholder="Rechercher..." />
            <datalist id="baseIdOptions">
                <option th:each="b : ${baseIds}" th:value="${b}"></option>
            </datalist>
        </div>
        <div>
            <label>Étoiles</label><br>
            <select name="etoiles">
                <option th:each="e : ${etoilesOptions}" th:value="${e}" th:text="${e}" th:selected="${e == 7}"></option>
            </select>
        </div>
        <div>
            <label>Relic</label><br>
            <select name="relic">
                <option th:each="r : ${relicOptions}" th:value="${r}" th:text="${r}" th:selected="${r == 6}"></option>
            </select>
        </div>
        <div>
            <label>Tag</label><br>
            <input type="text" name="tag" placeholder="ex: GAC, TB..." />
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Ajouter</button>
        </div>
    </form>
</div>

<h2>Unités du plan (<span th:text="${#lists.size(plans)}"></span>)</h2>
<table>
    <thead>
    <tr><th>Unité</th><th>Étoiles</th><th>Relic</th><th>Tag</th><th></th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${plans}">
        <form th:action="@{/plan-farm/modifier/{id}(id=${p.id})}" method="post">
            <td th:text="${p.baseId}"></td>
            <td>
                <select name="etoiles">
                    <option th:each="e : ${etoilesOptions}" th:value="${e}" th:text="${e}" th:selected="${e == p.etoilesCible}"></option>
                </select>
            </td>
            <td>
                <select name="relic">
                    <option th:each="r : ${relicOptions}" th:value="${r}" th:text="${r}" th:selected="${r == p.relicCible}"></option>
                </select>
            </td>
            <td><input type="text" name="tag" th:value="${p.tag}" /></td>
            <td><button type="submit" class="btn btn-primary">Actualiser</button></td>
        </form>
        <td>
            <form th:action="@{/plan-farm/supprimer/{id}(id=${p.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger" title="Supprimer" onclick="return confirm('Supprimer cette unité du plan ?');">🗑</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
