<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Statq : Définition des unités et des stats</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: center; }
        th { background: #f0f0f0; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        input[type=text], select { padding: 4px 6px; max-width: 200px; }
        .btn { padding: 5px 12px; cursor: pointer; }
        .btn-danger { background: #d73027; color: white; border: none; border-radius: 4px; }
        .btn-primary { background: #2a6cd6; color: white; border: none; border-radius: 4px; }
        a { color: #2a6cd6; text-decoration: none; }
    </style>
</head>
<body>
<p><a href="/guilde">&larr; Retour à la guilde</a></p>

<h1>Statq : Définition des unités et des stats</h1>

<div class="card">
    <h3>Ajouter / Modifier un toon</h3>
    <form th:action="@{/statq/ajouter}" method="post" style="display:flex; gap:10px; align-items:end; flex-wrap:wrap;">
        <div>
        	<label>Team</label><br>
       		<input type="text" name="team" placeholder="Équipe (ex: CLS, Troopers...)"  style="width:200px;"/>
        </div>
        <div>
            <label>Base ID</label><br>
            <input type="text" name="baseId" required placeholder="Base ID..." style="width:200px;" />
        </div>
        <div>
            <label>Stat 1</label><br>
            <select name="statId1">
                <option value="">-- Sélectionner --</option>
                <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}"></option>
            </select>
        </div>
        <div>
            <label>Stat 2</label><br>
            <select name="statId2">
                <option value="">-- Sélectionner --</option>
                <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}"></option>
            </select>
        </div>
        <div>
            <label>Stat 3</label><br>
            <select name="statId3">
                <option value="">-- Sélectionner --</option>
                <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}"></option>
            </select>
        </div>
        <div>
            <label>Stat 4</label><br>
            <select name="statId4">
                <option value="">-- Sélectionner --</option>
                <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}"></option>
            </select>
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
    </form>
</div>

<h2>Configurations existantes (<span th:text="${#lists.size(configs)}"></span>)</h2>
<table>
    <thead>
    <tr>
        <th>Team</th>
        <th>Base ID</th>
        <th>Stat 1</th>
        <th>Stat 2</th>
        <th>Stat 3</th>
        <th>Stat 4</th>
        <th>Action</th>
        <th>Supprimer</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${configs}">
        <form th:action="@{/statq/modifier/{id}(id=${c.id})}" method="post">
            <td>
    		<input type="text" name="team" th:value="${c.team}" placeholder="Team" style="text-align: center;"/>
			</td>
            <td th:text="${c.baseId}" style="font-weight:bold;"></td>
            <td>
                <select name="statId1">
                    <option value="">-- Aucune --</option>
                    <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}" th:selected="${s.statId == c.statId1}"></option>
                </select>
            </td>
            <td>
                <select name="statId2">
                    <option value="">-- Aucune --</option>
                    <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}" th:selected="${s.statId == c.statId2}"></option>
                </select>
            </td>
            <td>
                <select name="statId3">
                    <option value="">-- Aucune --</option>
                    <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}" th:selected="${s.statId == c.statId3}"></option>
                </select>
            </td>
            <td>
                <select name="statId4">
                    <option value="">-- Aucune --</option>
                    <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}" th:selected="${s.statId == c.statId4}"></option>
                </select>
            </td>
            <td><button type="submit" class="btn btn-primary">Mettre à jour</button></td>
        </form>
        <td>
            <form th:action="@{/statq/supprimer/{id}(id=${c.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger" title="Supprimer" onclick="return confirm('Supprimer cette configuration ?');">🗑</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
