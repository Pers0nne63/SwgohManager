<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner un joueur externe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } } }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 py-16 max-w-lg">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8">
            <h1 class="text-2xl font-extrabold text-white flex items-center gap-3 mb-2">
                <i class="bi bi-radar text-amber-400"></i> Scanner un joueur externe
            </h1>
            <p class="text-sm text-slate-400 mb-6">
                Entre l'allycode d'un joueur (dans ou hors de ta guilde) pour voir son roster, sa qualité de mods
                et sa comparaison avec vos plans de farm.
            </p>

            <div th:if="${erreur}" class="mb-4 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg px-4 py-3">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erreur}"></span>
            </div>

            <form th:action="@{/joueur-externe/scanner}" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Allycode</label>
                    <input type="text" name="allyCode" required placeholder="ex: 123456789"
                           pattern="[0-9]{9}" title="9 chiffres, sans tirets"
                           autocomplete="off"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 transition-colors">
                </div>
                <button type="submit"
                        class="w-full inline-flex items-center justify-center gap-2 bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 border border-amber-500/30 px-4 py-3 rounded-lg text-sm font-bold transition-all">
                    <i class="bi bi-search"></i> Scanner
                </button>
            </form>
            <div th:if="${joueursScannes != null and !#lists.isEmpty(joueursScannes)}" class="mt-8 pt-6 border-t border-slate-700">
			    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
			        Joueurs déjà scannés
			    </h2>
			    <ul class="space-y-1 max-h-72 overflow-y-auto pr-1">
			        <li th:each="j : ${joueursScannes}">
			            <a th:href="@{/joueur-externe/{id}(id=${j.playerId})}"
			               class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 hover:border-amber-500/50 hover:bg-slate-850 transition-colors text-sm">
			                <span class="text-slate-200">
			                    <span th:text="${j.playerName}">Pseudo</span>
			                    <span class="text-slate-500" th:text="${j.guildName != null ? ' - ' + j.guildName : ''}"></span>
			                </span>
			                <span class="text-xs text-slate-500 font-mono" th:text="'(' + ${j.allyCode} + ')'">-</span>
			            </a>
			        </li>
			    </ul>
			</div>
        </div>
    </main>
</body>
</html>
