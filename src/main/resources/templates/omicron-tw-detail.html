<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${joueur != null ? joueur.playerName + ' - Omicrons TW' : 'Omicrons TW'}">Omicrons TW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 lg:px-8 py-8 max-w-7xl">
        <!-- Liens de retour -->
        <div class="flex flex-wrap items-center gap-4 mb-6">
            <a th:href="@{/joueur/{id}(id=${joueur != null ? joueur.playerId : ''})}" 
               th:if="${joueur != null}" 
               class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-amber-400 transition-colors">
                <i class="bi bi-arrow-left me-2"></i> Retour à la fiche joueur
            </a>
            <span th:if="${joueur != null}" class="text-slate-600">|</span>
            <a href="/guilde" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-amber-400 transition-colors">
                <i class="bi bi-people me-2"></i> Retour à la guilde
            </a>
        </div>

        <!-- En-tête -->
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-shield-shaded text-indigo-400"></i> Détails des omicrons TW
            </h1>
            <p class="text-xl font-semibold text-amber-400 mt-2" th:text="${joueur != null ? joueur.playerName : 'Joueur introuvable'}"></p>
        </div>

        <!-- Grille des cartes de progression par priorité -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" th:if="${progression != null}">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden flex flex-col"
                 th:each="entry : ${progression.parPriorite()}" 
                 th:if="${entry.value != null and entry.value.total() > 0}">
                
                <!-- Titre de la carte avec pourcentage et ratio -->
                <div class="bg-slate-850 px-5 py-4 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-white text-base flex items-center gap-2">
                        <i class="bi bi-star-fill text-amber-400 text-sm"></i>
                        <span th:text="'Priorité ' + ${entry.key}"></span>
                    </h3>
                    <div class="text-right">
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full border"
                              th:classappend="${entry.value.atteint() == entry.value.total() ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-amber-500/10 border-amber-500/30 text-amber-400'}"
                              th:text="${#numbers.formatDecimal(entry.value.pourcentage(), 1, 1)} + ' %'">
                        </span>
                        <div class="text-xs text-slate-400 mt-1" th:text="${entry.value.atteint()} + ' / ' + ${entry.value.total()}"></div>
                    </div>
                </div>

                <!-- Tableau du détail des compétences -->
                <div class="p-4 flex-grow overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="text-slate-400 text-xs uppercase font-semibold border-b border-slate-700/60">
                            <tr>
                                <th class="pb-3 text-left">Unité - Compétence</th>
                                <th class="pb-3 text-center w-20">Statut</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/40">
                            <tr th:each="d : ${entry.value.details()}" class="hover:bg-slate-750/30 transition-colors">
                                <td class="py-3 text-slate-200 pr-2" th:text="${d.label()}"></td>
                                <td class="py-3 text-center">
                                    <span th:if="${d.atteint()}" class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 text-sm" title="Atteint">
                                        <i class="bi bi-check-lg"></i>
                                    </span>
                                    <span th:unless="${d.atteint()}" class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-red-500/20 text-red-400 text-sm" title="Non atteint">
                                        <i class="bi bi-x-lg"></i>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Message en cas de données de progression absentes ou vides -->
        <div th:if="${progression == null}" class="bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center text-slate-400">
            <i class="bi bi-exclamation-triangle text-3xl text-amber-400 block mb-2"></i>
            Aucune donnée de progression disponible.
        </div>
    </main>

</body>
</html>
