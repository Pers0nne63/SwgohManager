<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Détail - ' + ${detail.nom}">Détail Datacron</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } } }
        }
    </script>

    <style>
        .table-container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        table th {
            background-color: rgba(255, 255, 255, 0.03);
            color: #94a3b8;
            font-weight: 600;
            padding: 10px 14px;
            border-bottom: 1px solid #334155;
            text-align: left;
            white-space: nowrap;
        }
        table td {
            padding: 10px 14px;
            border-bottom: 1px solid #334155;
            color: #f8fafc;
        }
        table tbody tr:last-child td { border-bottom: none; }
        table tbody tr:hover { background-color: rgba(255, 255, 255, 0.02); }

        .ok { color: #4ade80; }
        .ko { color: #f87171; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 lg:px-8 py-8 max-w-6xl">

        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50">
            <h1 class="text-2xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-people-fill text-amber-400"></i>
                <span th:text="${detail.nom}"></span>
                <small class="text-base font-normal text-slate-400"
                       th:text="'SET ' + ${detail.setId} + ' — Tier max requis : T' + ${detail.tierMax}"></small>
            </h1>
            <a href="/web/plan-farm-datacron/progression"
               class="inline-flex items-center space-x-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl font-semibold text-sm transition-all duration-200">
                <i class="bi bi-arrow-left"></i>
                <span>Retour au suivi</span>
            </a>
        </div>

        <!-- Résumé -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-800 border border-red-500/30 rounded-2xl p-4">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Sans le Tier max</p>
                <p class="text-2xl font-bold text-red-400" th:text="${#lists.size(detail.joueursSansTierMax)}"></p>
            </div>
            <div class="bg-slate-800 border border-amber-500/30 rounded-2xl p-4">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Tier max OK, reste incomplet</p>
                <p class="text-2xl font-bold text-amber-400" th:text="${#lists.size(detail.joueursTierMaxSeul)}"></p>
            </div>
            <div class="bg-slate-800 border border-emerald-500/30 rounded-2xl p-4">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Conformes</p>
                <p class="text-2xl font-bold text-emerald-400" th:text="${#lists.size(detail.joueursConformes)}"></p>
            </div>
        </div>

        <!-- SECTION 1 : Sans le Tier max -->
        <h2 class="text-lg font-bold text-white mb-3 flex items-center gap-2">
            <i class="bi bi-x-circle text-red-400"></i> Joueurs n'ayant pas le Tier max (T<span th:text="${detail.tierMax}"></span>)
        </h2>
        <div th:if="${#lists.isEmpty(detail.joueursSansTierMax)}" class="text-slate-500 text-sm mb-8">
            Tous les joueurs actifs disposent du Tier max.
        </div>
        <div th:if="${!#lists.isEmpty(detail.joueursSansTierMax)}" class="table-container mb-8">
            <table>
                <thead>
                    <tr>
                        <th>Joueur</th>
                        <th th:each="mec : ${detail.joueursSansTierMax[0].mecaniques}" th:text="'T' + ${mec.tier}"></th>
                        <th th:each="stat : ${detail.joueursSansTierMax[0].stats}" th:text="${stat.statLibelle}"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="j : ${detail.joueursSansTierMax}">
                        <td th:text="${j.playerName}"></td>
                        <td th:each="mec : ${j.mecaniques}">
                            <i th:if="${mec.atteint}" class="bi bi-check-circle-fill ok"></i>
                            <i th:unless="${mec.atteint}" class="bi bi-x-circle-fill ko"></i>
                        </td>
                        <td th:each="stat : ${j.stats}">
                            <span th:class="${stat.atteint} ? 'ok' : 'ko'"
                                  th:text="${#numbers.formatDecimal(stat.valeurJoueur, 1, 2)} + ' / ' + ${#numbers.formatDecimal(stat.valeurCible, 1, 2)}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- SECTION 2 : Tier max OK, reste incomplet -->
        <h2 class="text-lg font-bold text-white mb-3 flex items-center gap-2">
            <i class="bi bi-exclamation-triangle text-amber-400"></i> Tier max atteint, mais autres tiers/stats manquants
        </h2>
        <div th:if="${#lists.isEmpty(detail.joueursTierMaxSeul)}" class="text-slate-500 text-sm mb-8">
            Aucun joueur dans cette situation.
        </div>
        <div th:if="${!#lists.isEmpty(detail.joueursTierMaxSeul)}" class="table-container mb-8">
            <table>
                <thead>
                    <tr>
                        <th>Joueur</th>
                        <th th:each="mec : ${detail.joueursTierMaxSeul[0].mecaniques}" th:text="'T' + ${mec.tier}"></th>
                        <th th:each="stat : ${detail.joueursTierMaxSeul[0].stats}" th:text="${stat.statLibelle}"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="j : ${detail.joueursTierMaxSeul}">
                        <td th:text="${j.playerName}"></td>
                        <td th:each="mec : ${j.mecaniques}">
                            <i th:if="${mec.atteint}" class="bi bi-check-circle-fill ok"></i>
                            <i th:unless="${mec.atteint}" class="bi bi-x-circle-fill ko"></i>
                        </td>
                        <td th:each="stat : ${j.stats}">
                            <span th:class="${stat.atteint} ? 'ok' : 'ko'"
                                  th:text="${#numbers.formatDecimal(stat.valeurJoueur, 1, 2)} + ' / ' + ${#numbers.formatDecimal(stat.valeurCible, 1, 2)}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- SECTION 3 : Conformes (repliable) -->
        <details class="mb-8">
            <summary class="text-sm font-bold text-slate-400 uppercase tracking-wider cursor-pointer flex items-center gap-2 mb-3">
                <i class="bi bi-check-circle text-emerald-400"></i>
                Joueurs conformes (<span th:text="${#lists.size(detail.joueursConformes)}"></span>)
            </summary>
            <div th:if="${!#lists.isEmpty(detail.joueursConformes)}" class="flex flex-wrap gap-2">
                <span th:each="j : ${detail.joueursConformes}"
                      class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs"
                      th:text="${j.playerName}"></span>
            </div>
        </details>

    </main>

</body>
</html>
