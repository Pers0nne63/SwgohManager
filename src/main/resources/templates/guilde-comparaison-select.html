<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparer une guilde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } } }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 py-16 max-w-lg">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8">
            <h1 class="text-2xl font-extrabold text-white flex items-center gap-3 mb-2">
                <i class="bi bi-arrow-left-right text-amber-400"></i> Comparer une guilde
            </h1>
            <p class="text-sm text-slate-400 mb-6">
                Renseigne l'ID de guilde pour lancer l'analyse comparative avec ta guilde.
            </p>

            <div th:if="${erreur}" class="mb-4 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg px-4 py-3">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erreur}"></span>
            </div>

            <!-- FORMULAIRE (masqué automatiquement si un scan est en cours, cf. script) -->
            <form id="formScan" th:action="@{/guilde-comparaison/scanner}" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">ID de Guilde ou Allycode</label>
                    <input type="text" name="guildId" required placeholder="ex: 123456789 ou ID"
                           autocomplete="off"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 transition-colors">
                </div>
                <button type="submit"
                        class="w-full inline-flex items-center justify-center gap-2 bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 border border-amber-500/30 px-4 py-3 rounded-lg text-sm font-bold transition-all">
                    <i class="bi bi-bar-chart-line"></i> Lancer la comparaison
                </button>
            </form>

            <!-- BLOC PROGRESSION (masqué par défaut, affiché uniquement pendant un scan en cours) -->
            <div id="progressBlock" class="hidden">
                <div class="flex items-center justify-between mb-2">
                    <span id="progressStep" class="text-xs font-bold text-amber-400 uppercase tracking-wide">Initialisation...</span>
                    <span id="progressPercent" class="text-xs font-mono text-slate-400">0%</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-700">
                    <div id="progressBar" class="bg-amber-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="progressMessage" class="text-[11px] text-slate-500 mt-2 truncate">En attente...</p>
            </div>

            <!-- ÉLÉMENT CORRIGÉ : On boucle sur 'comparaisons' issu du controller -->
            <div id="historiqueBlock" th:if="${comparaisons != null and !#lists.isEmpty(comparaisons)}" class="mt-8 pt-6 border-t border-slate-700">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                    Comparaisons récentes
                </h2>
                <ul class="space-y-1 max-h-72 overflow-y-auto pr-1">
                    <li th:each="c : ${comparaisons}">
                        <a th:href="@{/guilde-comparaison/{id}(id=${c.guildIdB})}"
                           class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 hover:border-amber-500/50 hover:bg-slate-850 transition-colors text-sm">
                            <span class="text-slate-200 font-medium" th:text="${c.guildNomB != null ? c.guildNomB : c.guildIdB}">Nom / ID Guilde</span>
                            <span class="text-xs text-slate-500 font-mono" th:text="${c.dateComparaison != null ? #temporals.format(c.dateComparaison, 'dd/MM/yyyy') : ''}">-</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        // Si on arrive avec ?syncing=guildId (juste après avoir soumis le formulaire), on ouvre le flux SSE
        const params = new URLSearchParams(window.location.search);
        const syncingGuildId = params.get('syncing');

        if (syncingGuildId) {
            document.getElementById('formScan').classList.add('hidden');
            document.getElementById('progressBlock').classList.remove('hidden');
            const historiqueBlock = document.getElementById('historiqueBlock');
            if (historiqueBlock) historiqueBlock.classList.add('hidden');

            const source = new EventSource('/guilde-comparaison/progress');

            source.addEventListener('progress', (event) => {
                const data = JSON.parse(event.data);
                document.getElementById('progressBar').style.width = data.percent + '%';
                document.getElementById('progressPercent').textContent = data.percent + '%';
                document.getElementById('progressStep').textContent = data.step;
                document.getElementById('progressMessage').textContent = data.message;

                if (data.error) {
                    document.getElementById('progressStep').textContent = 'Erreur';
                    document.getElementById('progressStep').classList.replace('text-amber-400', 'text-red-400');
                    document.getElementById('progressMessage').textContent = data.message;
                    source.close();
                    return;
                }

                if (data.completed) {
                    source.close();
                    window.location.href = '/guilde-comparaison/' + syncingGuildId;
                }
            });

            source.onerror = () => {
                // Connexion perdue : on ne casse pas la page, l'utilisateur peut recharger
                source.close();
            };
        }
    </script>
</body>
</html>
