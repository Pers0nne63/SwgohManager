<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${joueur != null ? joueur.playerName + ' - Plan de farm' : 'Plan de farm'}">Plan de farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-6 max-w-7xl">

        <!-- Fil d'ariane -->
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-4 text-xs">
            <a href="/plan-farm/suivi" class="text-slate-400 hover:text-amber-400 font-medium transition-colors">
                <i class="bi bi-arrow-left me-1"></i> Suivi plan de farm
            </a>
            <span class="text-slate-600">/</span>
            <a th:href="@{/joueur/{id}(id=${joueur != null ? joueur.playerId : ''})}" class="text-slate-400 hover:text-amber-400 font-medium transition-colors">
                <i class="bi bi-person-badge me-1"></i> Fiche Joueur
            </a>
            <span class="text-slate-600">/</span>
            <a href="/plan-farm" class="text-slate-400 hover:text-amber-400 font-medium transition-colors">
                <i class="bi bi-journal-check"></i> Définition plan de farm commun
            </a>
            <span class="text-slate-600">/</span>
            <a th:href="@{/web/plan-farm-ind/joueur/{id}(id=${joueur != null ? joueur.playerId : ''})}" class="text-slate-400 hover:text-amber-400 font-medium transition-colors">
                <i class="bi bi-journal-check"></i> Plan de farm individuel
            </a>
        </div>

        <!-- Header joueur + progression globale (une seule card compacte) -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-5 shadow-lg">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                <h1 class="text-2xl font-extrabold text-white flex items-center gap-3">
                    <span th:text="${joueur != null ? joueur.playerName : 'Joueur introuvable'}"></span>
                    <span th:if="${joueur != null}" class="bg-slate-700 text-amber-400 text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-slate-600"
                          th:text="'PG: ' + ${#numbers.formatInteger(joueur.galacticPower, 0, 'WHITESPACE')}"></span>
                </h1>
                <div class="text-right">
                    <span class="text-2xl font-black text-emerald-400" th:text="${#numbers.formatDecimal(progression.pourcentage, 1, 1)} + ' %'">0 %</span>
                    <p class="text-[11px] text-slate-400">
                        <span class="font-bold text-emerald-400" th:text="${progression.atteint}"></span> objectifs atteints sur
                        <span class="font-bold text-slate-200" th:text="${progression.total}"></span>
                    </p>
                </div>
            </div>
            <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-700/60">
                <div class="bg-gradient-to-r from-emerald-600 to-teal-400 h-full transition-all duration-500"
                     th:style="'width: ' + ${progression.pourcentage} + '%'"></div>
            </div>
        </div>

        <!-- Cards : 1 par tag, 2 par ligne -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
            <div th:each="entry : ${detailsParTag}"
                 th:with="nbAtteints=${#lists.size(entry.value.?[atteint])}, nbTotal=${#lists.size(entry.value)}"
                 class="bg-slate-800 border border-slate-700 rounded-xl shadow-lg overflow-hidden">

                <!-- En-tête de la card : tag + progression du tag -->
                <div class="px-4 py-2.5 border-b border-slate-700 bg-slate-850">
                    <div class="flex justify-between items-center mb-1.5">
                        <h2 class="text-sm font-bold text-white flex items-center gap-2">
                            <i class="bi bi-tag-fill text-amber-400 text-xs"></i>
                            <span th:text="${entry.key}">GAC</span>
                        </h2>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full border"
                              th:classappend="${nbAtteints == nbTotal} ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-slate-700/50 text-slate-300 border-slate-600'"
                              th:text="${nbAtteints} + ' / ' + ${nbTotal}">0 / 0</span>
                    </div>
                    <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-gradient-to-r from-emerald-600 to-teal-400 h-full"
                             th:style="'width: ' + ${nbTotal > 0 ? (nbAtteints * 100.0 / nbTotal) : 0} + '%'"></div>
                    </div>
                </div>

                <!-- Légende des colonnes -->
                <div class="grid grid-cols-[1fr_2.5rem_3.5rem_3.5rem_1.5rem] gap-2 px-4 py-1.5 text-[9px] uppercase tracking-wider font-semibold text-slate-500 border-b border-slate-700/60">
                    <span>Unité</span>
                    <span class="text-center" title="Étoiles cible">★</span>
                    <span class="text-center" title="Relic cible">R cible</span>
                    <span class="text-center" title="Relic actuel">R actuel</span>
                    <span class="text-center">Statut</span>
                </div>

                <!-- Lignes -->
                <div class="divide-y divide-slate-700/60">
                    <div th:each="d : ${entry.value}"
                         class="grid grid-cols-[1fr_2.5rem_3.5rem_3.5rem_1.5rem] gap-2 items-center px-4 py-1.5 text-xs hover:bg-slate-700/20 transition-colors"
                         th:classappend="${d.atteint} ? '' : 'bg-rose-500/5'">
                        <span class="font-bold text-white truncate" th:text="${d.nomUnite}" th:title="${d.nomUnite}"></span>
                        <span class="text-center text-slate-300 font-mono" th:text="${d.etoilesCible}"></span>
                        <span class="text-center text-slate-300 font-mono" th:text="${d.relicCible}"></span>
                        <span class="text-center font-mono"
                              th:classappend="${d.atteint} ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'"
                              th:text="${d.relicActuel != null ? d.relicActuel : '-'}"></span>
                        <span class="text-center">
                            <i th:if="${d.atteint}" class="bi bi-check-circle-fill text-emerald-400" title="Atteint"></i>
                            <i th:unless="${d.atteint}" class="bi bi-x-circle-fill text-rose-400" title="En cours"></i>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Aucun objectif -->
        <div th:if="${#maps.isEmpty(detailsParTag)}" class="text-center text-slate-500 text-sm py-10">
            Aucune unité dans le plan de farm.
        </div>
    </main>
</body>
</html>
