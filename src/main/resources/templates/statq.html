<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatQ Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <!-- Conteneur élargi à max-w-[95rem] (~1520px) -->
    <main class="flex-grow container mx-auto px-2 sm:px-4 lg:px-6 py-8 max-w-[95rem]">
        <a href="/guilde" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-amber-400 mb-6 transition-colors">
            <i class="bi bi-arrow-left me-2"></i> Retour à la guilde
        </a>

        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-cpu text-indigo-400"></i> StatQ : Configuration des Unités
            </h1>
        </div>

        <!-- Formulaire d'ajout -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="bi bi-plus-circle text-amber-400"></i> Ajouter / Modifier un toon
            </h2>
            <form th:action="@{/statq/ajouter}" method="post" class="flex flex-wrap gap-3 items-end">
                <div class="w-full sm:w-36">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Team</label>
                    <input type="text" name="team" placeholder="ex: CLS..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500 text-sm" />
                </div>
                <div class="w-full sm:w-52">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Unité</label>
                    <input type="text" name="selection" list="optionsUnites" required placeholder="Rechercher une unité..." autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500 text-sm" />
                    <datalist id="optionsUnites">
                        <option th:each="u : ${unites}" th:value="${u.libelle}"></option>
                    </datalist>
                </div>
                <div class="w-full sm:w-28">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Stat 1</label>
                    <select name="statId1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-1.5 py-2 text-slate-100 focus:outline-none focus:border-amber-500 text-xs truncate">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}"></option>
                    </select>
                </div>
                <div class="w-full sm:w-28">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Stat 2</label>
                    <select name="statId2" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-1.5 py-2 text-slate-100 focus:outline-none focus:border-amber-500 text-xs truncate">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}"></option>
                    </select>
                </div>
                <div class="w-full sm:w-28">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Stat 3</label>
                    <select name="statId3" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-1.5 py-2 text-slate-100 focus:outline-none focus:border-amber-500 text-xs truncate">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}"></option>
                    </select>
                </div>
                <div class="w-full sm:w-28">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Stat 4</label>
                    <select name="statId4" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-1.5 py-2 text-slate-100 focus:outline-none focus:border-amber-500 text-xs truncate">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}"></option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-xl transition-colors shadow-lg text-sm">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>

        <!-- Configurations existantes -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
            <div class="p-5 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="bi bi-gear text-amber-400"></i> Configurations existantes
                </h2>
                <span class="bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs px-3 py-1 rounded-full font-bold" th:text="${configs != null ? #lists.size(configs) : 0}">0</span>
            </div>

            <div class="overflow-x-auto">
                <!-- table-fixed avec répartition exacte des largeurs -->
                <table class="w-full text-center text-sm text-slate-300 table-fixed">
                    <thead class="bg-slate-850 text-slate-400 uppercase text-xs font-semibold border-b border-slate-700">
                        <tr>
                            <th class="px-2 py-3 w-[12%]">Team</th>
                            <th class="px-3 py-3 text-left w-[22%]">Unité</th>
                            <th class="px-1 py-3 w-[14%]">Stat 1</th>
                            <th class="px-1 py-3 w-[14%]">Stat 2</th>
                            <th class="px-1 py-3 w-[14%]">Stat 3</th>
                            <th class="px-1 py-3 w-[14%]">Stat 4</th>
                            <th class="px-2 py-3 w-[5%]">Action</th>
                            <th class="px-2 py-3 w-[5%]">Suppr.</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/60">
                        <tr th:each="c : ${configs}" class="hover:bg-slate-750/50 transition-colors" th:if="${configs != null}">
                            <form th:action="@{/statq/modifier/{id}(id=${c.id})}" method="post">
                                <td class="px-2 py-3">
                                    <input type="text" name="team" th:value="${c.team}" class="w-full bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-xs text-center text-slate-200" />
                                </td>
                                <td class="px-3 py-3 text-left font-bold text-white truncate" th:text="${c.nomUnite}"></td>
                                <td class="px-1 py-3">
                                    <select name="statId1" class="w-full max-w-[130px] bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs text-slate-200 truncate">
                                        <option value="">-- Aucune --</option>
                                        <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}" th:selected="${s.statId == c.statId1}"></option>
                                    </select>
                                </td>
                                <td class="px-1 py-3">
                                    <select name="statId2" class="w-full max-w-[130px] bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs text-slate-200 truncate">
                                        <option value="">-- Aucune --</option>
                                        <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}" th:selected="${s.statId == c.statId2}"></option>
                                    </select>
                                </td>
                                <td class="px-1 py-3">
                                    <select name="statId3" class="w-full max-w-[130px] bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs text-slate-200 truncate">
                                        <option value="">-- Aucune --</option>
                                        <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}" th:selected="${s.statId == c.statId3}"></option>
                                    </select>
                                </td>
                                <td class="px-1 py-3">
                                    <select name="statId4" class="w-full max-w-[130px] bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs text-slate-200 truncate">
                                        <option value="">-- Aucune --</option>
                                        <option th:each="s : ${stats}" th:value="${s.statId}" th:text="${s.libellé}" th:selected="${s.statId == c.statId4}"></option>
                                    </select>
                                </td>
                                <td class="px-2 py-3">
                                    <button type="submit" class="px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-medium transition-colors">MAJ</button>
                                </td>
                            </form>
                            <td class="px-2 py-3">
                                <form th:action="@{/statq/supprimer/{id}(id=${c.id})}" method="post" class="inline">
                                    <button type="submit" class="p-1.5 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded transition-colors" onclick="return confirm('Supprimer cette configuration ?');">🗑</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${configs == null or #lists.isEmpty(configs)}">
                            <td colspan="8" class="px-6 py-8 text-center text-slate-500">
                                Aucune configuration enregistrée.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
