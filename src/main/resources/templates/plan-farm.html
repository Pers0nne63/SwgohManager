<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8 max-w-7xl">
        <a href="/guilde" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-amber-400 mb-6 transition-colors">
            <i class="bi bi-arrow-left me-2"></i> Retour à la guilde
        </a>

        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-journal-check text-emerald-400"></i> Plan de Farm Global
            </h1>
        </div>

        <!-- Formulaire d'ajout -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="bi bi-plus-circle text-amber-400"></i> Ajouter une unité au plan
            </h2>
            <form th:action="@{/plan-farm/ajouter}" method="post" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Unité</label>
                    <input type="text" name="selection" list="baseIdOptions" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500 text-sm" required placeholder="Rechercher une unité..." autocomplete="off" />
                    <datalist id="baseIdOptions">
                        <option th:each="u : ${unites}" th:value="${u.libelle}"></option>
                    </datalist>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Étoiles</label>
                    <select name="etoiles" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500 text-sm">
                        <option th:each="e : ${etoilesOptions}" th:value="${e}" th:text="${e}" th:selected="${e == 7}"></option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Relic</label>
                    <select name="relic" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500 text-sm">
                        <option th:each="r : ${relicOptions}" th:value="${r}" th:text="${r}" th:selected="${r == 6}"></option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Tag</label>
                    <input type="text" name="tag" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500 text-sm" placeholder="ex: GAC, TB..." />
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-4 rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2 text-sm">
                        <i class="bi bi-plus-lg"></i> Ajouter
                    </button>
                </div>
            </form>
        </div>

        <!-- Card Table -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="bi bi-list-check text-amber-400"></i> Unités définies
                </h2>
                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-bold" th:text="${#lists.size(plans)}">0</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-850 text-slate-400 uppercase text-xs font-semibold border-b border-slate-700">
                        <tr>
                            <th class="px-6 py-4">Unité</th>
                            <th class="px-4 py-4 w-32">Étoiles</th>
                            <th class="px-4 py-4 w-32">Relic</th>
                            <th class="px-4 py-4">Tag</th>
                            <th class="px-4 py-4 text-center w-28">Action</th>
                            <th class="px-4 py-4 text-center w-20">Suppr.</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/60">
                        <tr th:each="p : ${plans}" class="hover:bg-slate-750/50 transition-colors">
                            <td class="px-6 py-4 font-bold text-white" th:text="${p.nomUnite}"></td>
                            <form th:action="@{/plan-farm/modifier/{id}(id=${p.id})}" method="post">
                                <td class="px-4 py-4">
                                    <select name="etoiles" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-200">
                                        <option th:each="e : ${etoilesOptions}" th:value="${e}" th:text="${e}" th:selected="${e == p.etoilesCible}"></option>
                                    </select>
                                </td>
                                <td class="px-4 py-4">
                                    <select name="relic" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-200">
                                        <option th:each="r : ${relicOptions}" th:value="${r}" th:text="${r}" th:selected="${r == p.relicCible}"></option>
                                    </select>
                                </td>
                                <td class="px-4 py-4">
                                    <input type="text" name="tag" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-200 w-full" th:value="${p.tag}" />
                                </td>
                                <td class="px-4 py-4 text-center">
                                    <button type="submit" class="p-2 bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600 hover:text-white rounded-lg transition-colors border border-indigo-500/30">
                                        <i class="bi bi-check-lg"></i>
                                    </button>
                                </td>
                            </form>
                            <td class="px-4 py-4 text-center">
                                <form th:action="@{/plan-farm/supprimer/{id}(id=${p.id})}" method="post" class="inline">
                                    <button type="submit" class="p-2 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-lg transition-colors border border-red-500/30" onclick="return confirm('Supprimer cette unité du plan ?');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
