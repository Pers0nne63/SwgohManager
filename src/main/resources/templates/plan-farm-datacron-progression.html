<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Plan de Farm Datacron</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } } }
        }
    </script>

    <style>
        summary { cursor: pointer; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        summary .chevron { transition: transform 0.2s; }
        details[open] > summary .chevron { transform: rotate(90deg); }

        .badge-pct {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            padding: 2px 10px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .badge-pct.high { background-color: rgba(34, 197, 94, 0.12); color: #4ade80; }
        .badge-pct.mid { background-color: rgba(245, 158, 11, 0.12); color: #fbbf24; }
        .badge-pct.low { background-color: rgba(239, 68, 68, 0.12); color: #f87171; }

        .bar-bg {
            background-color: rgba(255,255,255,0.05);
            border-radius: 9999px;
            overflow: hidden;
            height: 6px;
        }
        .bar-fill { height: 100%; border-radius: 9999px; }

        .tab-btn {
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 10px 10px 0 0;
            color: #94a3b8;
            border: 1px solid transparent;
        }
        .tab-btn:hover { color: #e2e8f0; }
        .tab-btn.active {
            color: #fbbf24;
            background-color: rgba(30, 41, 59, 1);
            border-color: rgb(51 65 85);
            border-bottom-color: transparent;
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 lg:px-8 py-8 max-w-5xl">

        <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50">
            <h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-bar-chart-fill text-amber-400"></i>
                <span>Suivi Plan de Farm Datacron</span>
            </h1>
            <a href="/web/plan-farm-datacron"
               class="inline-flex items-center space-x-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl font-semibold text-sm transition-all duration-200">
                <i class="bi bi-gear"></i>
                <span>Gérer les cibles</span>
            </a>
        </div>

        <div th:if="${#lists.isEmpty(sets)}" class="text-center py-20 text-slate-500">
            <i class="bi bi-inbox text-4xl mb-3 block"></i>
            Aucun objectif de datacron défini, ou aucun joueur actif dans la guilde.
        </div>

        <div th:if="${!#lists.isEmpty(sets)}">

            <!-- NAVIGATION ONGLETS -->
            <div class="flex flex-wrap gap-1 border-b border-slate-700 mb-0">
                <button type="button" class="tab-btn active" data-tab-target="tab-synthese">
                    <i class="bi bi-grid-1x2 me-1"></i> Synthèse
                </button>
                <button type="button" th:each="onglet : ${onglets}"
                        class="tab-btn" th:data-tab-target="'tab-set-' + ${onglet.setId}"
                        th:text="'SET ' + ${onglet.setId}"></button>
            </div>

			<!-- ONGLET SYNTHESE (page d'origine) -->
			<div id="tab-synthese" class="tab-panel active pt-4">
			    <div class="space-y-4">
			        <th:block th:each="set : ${sets}">
			            <details th:replace="~{fragments/plan-farm-datacron-fragments :: setSynthese(${set})}"></details>
			        </th:block>
			    </div>
			</div>

            <!-- UN ONGLET PAR SET -->
            <div th:each="onglet : ${onglets}"
                 th:id="'tab-set-' + ${onglet.setId}" class="tab-panel pt-4 space-y-5">

                <!-- Tableau de synthèse du set -->
                <div>
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="bi bi-bar-chart-line text-amber-400"></i> Synthèse du set
                    </h3>
                    <details th:replace="~{fragments/plan-farm-datacron-fragments :: setSynthese(${onglet.synthese})}"></details>
                </div>

                <!-- Détail par joueur pour ce set -->
                <div>
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="bi bi-people-fill text-amber-400"></i> Détail par joueur
                        <span class="text-slate-600 normal-case font-normal">(du moins au plus conforme)</span>
                    </h3>

                    <div th:if="${#lists.isEmpty(onglet.joueurs)}" class="text-slate-500 text-sm py-6 text-center">
                        Aucun joueur avec des datacrons trackés pour ce set.
                    </div>

                    <div th:if="${!#lists.isEmpty(onglet.joueurs)}" class="space-y-3">
                        <details th:each="jd : ${onglet.joueurs}" class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden">
                            <summary class="flex items-center justify-between px-5 py-3.5 hover:bg-slate-700/30 transition-colors">
                                <div class="flex items-center gap-3">
                                    <i class="bi bi-chevron-right chevron text-slate-400"></i>
                                    <span class="text-sm font-bold text-white" th:text="${jd.playerName}"></span>
                                    <span class="text-xs text-slate-500"
                                          th:text="${jd.detail.datacronsAtteints} + ' / ' + ${jd.detail.datacronsTotal} + ' conformes'"></span>
                                </div>
                                <span class="badge-pct"
                                      th:classappend="${jd.detail.pourcentage >= 80} ? 'high' : (${jd.detail.pourcentage >= 50} ? 'mid' : 'low')"
                                      th:text="${#numbers.formatDecimal(jd.detail.pourcentage, 1, 1)} + ' %'"></span>
                            </summary>

                            <div class="border-t border-slate-700 px-5 py-4 space-y-2">
                                <div th:each="dtc : ${jd.detail.datacrons}"
                                     class="bg-slate-850 border border-slate-700/60 rounded-xl p-3.5">
                                    <div class="flex items-center justify-between mb-2.5">
                                        <span class="text-sm font-semibold text-slate-200" th:text="${dtc.nom}"></span>
                                        <i th:class="${dtc.toutAtteint} ? 'bi bi-check-circle-fill text-emerald-400' : 'bi bi-x-circle-fill text-red-400'"></i>
                                    </div>

                                    <div th:if="${!#lists.isEmpty(dtc.mecaniques)}" class="space-y-1.5 mb-2">
                                        <div th:each="mec : ${dtc.mecaniques}" class="flex items-center justify-between gap-3 text-xs">
                                            <span class="text-slate-400 truncate" th:text="'[T' + ${mec.tier} + '] ' + ${mec.description}"></span>
                                            <i th:class="${mec.atteint} ? 'bi bi-check-lg text-emerald-400 shrink-0' : 'bi bi-x-lg text-red-400 shrink-0'"></i>
                                        </div>
                                    </div>

                                    <div th:if="${!#lists.isEmpty(dtc.stats)}" class="space-y-1.5">
                                        <div th:each="stat : ${dtc.stats}" class="flex items-center justify-between gap-3 text-xs">
                                            <span class="text-slate-400 truncate"
                                                  th:text="${stat.statLibelle} + ' (≥ ' + ${#numbers.formatDecimal(stat.valeurCible, 1, 2)} + ') — ' + ${#numbers.formatDecimal(stat.valeurJoueur, 1, 2)}"></span>
                                            <i th:class="${stat.atteint} ? 'bi bi-check-lg text-emerald-400 shrink-0' : 'bi bi-x-lg text-red-400 shrink-0'"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </details>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <script>
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tabTarget).classList.add('active');
            });
        });
    </script>

</body>
</html>
