<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${joueur != null ? joueur.playerName + ' - Plan de farm' : 'Plan de farm'}">Plan de farm</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: center; }
        th { background: #f0f0f0; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: inline-block; }
        a { color: #2a6cd6; text-decoration: none; }
        .ok { color: #1a9850; font-weight: bold; }
        .ko { color: #d73027; font-weight: bold; }
    </style>
</head>
<body>
<p><a th:href="@{/joueur/{id}(id=${joueur != null ? joueur.playerId : ''})}">&larr; Retour à la fiche joueur</a></p>
<p><a href="/guilde">&larr; Retour à la guilde</a></p>

<h1>
    <span th:text="${joueur != null ? joueur.playerName : 'Joueur introuvable'}"></span>
    <small th:if="${joueur != null}" style="font-weight:normal; color:#666;"
           th:text="'(GP: ' + ${#numbers.formatInteger(joueur.galacticPower, 0, 'DEFAULT')} + ')'"></small>
</h1>

<div class="card">
    <h3>Progression du plan de farm</h3>
    <p>Score : <b th:text="${#numbers.formatDecimal(progression.pourcentage, 1, 1)} + ' %'"></b></p>
    <p><span class="ok" th:text="${progression.atteint}"></span> atteint(s) / <span th:text="${progression.total}"></span></p>
</div>

<h2>Détail par unité</h2>
<table>
    <thead>
    <tr><th>Unité</th><th>Étoiles cible</th><th>Relic cible</th><th>Relic actuel</th><th>Statut</th></tr>
    </thead>
    <tbody>
    <tr th:each="d : ${progression.details}">
    <td th:text="${d.baseId}"></td>
    <td th:text="${d.etoilesCible}"></td>
    <td th:text="${d.relicCible}"></td>
    <td th:text="${d.relicActuel != null ? d.relicActuel : '-'}"></td>
    <td>
        <span th:if="${d.atteint}" class="ok">✅</span>
        <span th:unless="${d.atteint}" class="ko">❌</span>
    </td>
</tr>
    </tbody>
</table>

</body>
</html>
