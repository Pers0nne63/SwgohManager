<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Comparaison — ' + ${vm.guildeB.nom}">Comparaison de guilde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } } }
        }
    </script>
    <style>
        .winner-glow { box-shadow: 0 0 0 1px rgba(251,191,36,0.35), 0 0 14px -4px rgba(251,191,36,0.3); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 lg:px-8 py-6 max-w-5xl">

        <a href="/guilde-comparaison" class="inline-flex items-center text-xs font-medium text-slate-400 hover:text-amber-400 mb-4 transition-colors">
            <i class="bi bi-arrow-left me-2"></i> Comparer une autre guilde
        </a>

        <!-- EN-TÊTE : VS -->
        <div class="mb-5 bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 shadow-sm">
            <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
                <div class="text-right">
                    <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-0.5">Votre guilde</p>
                    <h2 class="text-lg font-extrabold text-white truncate" th:text="${vm.guildeA.nom}">Les Baguettes Enflammées</h2>
                    <p class="text-[11px] text-slate-500" th:text="${vm.guildeA.nbMembres} + ' membres'">50 membres</p>
                    <p class="text-[11px] text-amber-400 font-mono font-bold mt-0.5">
                        <span th:text="${vm.guildeA.galacticPower}">180 000 000</span> <i class="bi bi-shield-fill text-[9px]"></i>
                    </p>
                </div>

                <div class="flex flex-col items-center px-2">
                    <div class="w-10 h-10 rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-black text-xs">
                        VS
                    </div>
                    <span class="text-[9px] text-slate-500 mt-1 whitespace-nowrap" th:text="${#temporals.format(vm.dateComparaison, 'dd/MM/yyyy HH:mm')}">-</span>
                </div>

                <div class="text-left">
                    <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-0.5">Guilde comparée</p>
                    <h2 class="text-lg font-extrabold text-white truncate" th:text="${vm.guildeB.nom}">Guilde Externe</h2>
                    <p class="text-[11px] text-slate-500" th:text="${vm.guildeB.nbMembres} + ' membres'">45 membres</p>
                    <p class="text-[11px] text-amber-400 font-mono font-bold mt-0.5">
                        <i class="bi bi-shield-fill text-[9px]"></i> <span th:text="${vm.guildeB.galacticPower}">165 000 000</span>
                    </p>
                </div>
            </div>

            <form th:action="@{/guilde-comparaison/scanner}" method="post" class="flex justify-center mt-3">
                <input type="hidden" name="guildId" th:value="${vm.guildeB.guildId}" />
                <button type="submit"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 border border-amber-500/30 rounded-lg text-[11px] font-bold transition-all shadow-sm">
                    <i class="bi bi-arrow-clockwise"></i> Relancer la comparaison
                </button>
            </form>
        </div>

        <!-- INDICATEURS GLOBAUX : 2 colonnes miroir -->
        <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
            <i class="bi bi-bar-chart-line text-amber-400"></i> Indicateurs globaux
        </h3>
        <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="bg-slate-800 border border-slate-700 rounded-xl divide-y divide-slate-700/60 overflow-hidden">
                <div th:each="m : ${vm.metrics}"
                     th:classappend="${m.winner == 'A'} ? 'winner-glow bg-amber-500/5' : ''"
                     class="flex items-center justify-between px-3 py-1.5">
                    <span class="text-[11px] text-slate-400 flex items-center gap-1.5 truncate">
                        <i th:class="'bi ' + ${m.icon} + ' text-slate-500 text-[10px]'"></i>
                        <span th:text="${m.label}">Label</span>
                    </span>
                    <span th:class="${m.winner == 'A'} ? 'text-amber-400 font-bold' : 'text-slate-300 font-semibold'"
                          class="text-xs font-mono" th:text="${m.valueA}">0</span>
                </div>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-xl divide-y divide-slate-700/60 overflow-hidden">
                <div th:each="m : ${vm.metrics}"
                     th:classappend="${m.winner == 'B'} ? 'winner-glow bg-amber-500/5' : ''"
                     class="flex items-center justify-between px-3 py-1.5">
                    <span th:class="${m.winner == 'B'} ? 'text-amber-400 font-bold' : 'text-slate-300 font-semibold'"
                          class="text-xs font-mono" th:text="${m.valueB}">0</span>
                    <span class="text-[11px] text-slate-400 flex items-center gap-1.5 truncate justify-end">
                        <span th:text="${m.label}">Label</span>
                        <i th:class="'bi ' + ${m.icon} + ' text-slate-500 text-[10px]'"></i>
                    </span>
                </div>
            </div>
        </div>

        <!-- REPARTITION RELIQUES : 2 colonnes miroir -->
        <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
            <i class="bi bi-gem text-purple-400"></i> Répartition des reliques
        </h3>
        <div class="space-y-3 mb-5">
            <div th:each="cote, iter : ${vm.relicCotes}" class="bg-slate-800 border border-slate-700 rounded-xl p-3">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-2 truncate"
                   th:text="${iter.index == 0 ? vm.guildeA.nom : vm.guildeB.nom}">Guilde</p>
                <div class="grid grid-cols-6 gap-1.5">
                    <div th:each="tier : ${cote}" class="bg-slate-850 py-1.5 rounded-lg border border-slate-700/60 text-center">
                        <span class="block text-[8px] font-bold text-slate-500" th:text="${tier.label}">R10</span>
                        <b class="text-xs font-mono" th:classappend="${tier.winner} ? 'text-amber-400' : 'text-slate-300'" th:text="${tier.value}">0</b>
                    </div>
                </div>
            </div>
        </div>

        <!-- STATQ PAR TEAM : 2 colonnes miroir -->
        <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
            <i class="bi bi-graph-up text-emerald-400"></i> StatQ moyen par Team
        </h3>
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-800 border border-slate-700 rounded-xl divide-y divide-slate-700/60 overflow-hidden">
                <div th:each="row : ${vm.statQParTeam}"
                     th:classappend="${row.winner == 'A'} ? 'winner-glow bg-amber-500/5' : ''"
                     class="flex items-center justify-between px-3 py-1.5">
                    <span class="text-[11px] text-slate-400 truncate" th:text="${row.team}">Team</span>
                    <span th:class="${row.winner == 'A'} ? 'text-amber-400 font-bold' : 'text-slate-300 font-semibold'"
                          class="text-xs font-mono" th:text="${row.valueA}">0.00</span>
                </div>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-xl divide-y divide-slate-700/60 overflow-hidden">
                <div th:each="row : ${vm.statQParTeam}"
                     th:classappend="${row.winner == 'B'} ? 'winner-glow bg-amber-500/5' : ''"
                     class="flex items-center justify-between px-3 py-1.5">
                    <span th:class="${row.winner == 'B'} ? 'text-amber-400 font-bold' : 'text-slate-300 font-semibold'"
                          class="text-xs font-mono" th:text="${row.valueB}">0.00</span>
                    <span class="text-[11px] text-slate-400 truncate text-right" th:text="${row.team}">Team</span>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
