<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omicrons TW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 lg:px-8 py-8 max-w-6xl">

        <!-- Titre principal -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-shield-shaded text-indigo-400"></i> Omicrons TW
            </h1>
        </div>

        <!-- Formulaire d'ajout (Card) -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="bi bi-plus-circle text-amber-400"></i> Ajouter un omicron
            </h2>
            <form th:action="@{/omicron-tw/ajouter}" method="post" class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[280px]">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Unité - Compétence</label>
                    <input type="text" name="selection" list="optionsOmicron" required placeholder="Rechercher..." autocomplete="off" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500 text-sm transition-colors" />
                    <datalist id="optionsOmicron">
                        <option th:each="o : ${options}" th:value="${o.label}"></option>
                    </datalist>
                </div>

                <div class="w-full sm:w-36">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Priorité</label>
                    <select name="priorite" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500 text-sm">
                        <option th:each="p : ${prioriteOptions}" th:value="${p}" th:text="'P' + ${p}"></option>
                    </select>
                </div>

                <div>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-6 rounded-xl transition-colors shadow-lg text-sm flex items-center gap-2">
                        <i class="bi bi-check-lg"></i> Ajouter
                    </button>
                </div>
            </form>
        </div>

        <!-- Tableau des Omicrons du plan -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
            <div class="p-5 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="bi bi-list-stars text-amber-400"></i> Omicrons du plan
                </h2>
                <!-- Sécurisé contre les listes nulles -->
                <span class="bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs px-3 py-1 rounded-full font-bold" 
                      th:text="${plans != null ? #lists.size(plans) : 0}">0</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-850 text-slate-400 uppercase text-xs font-semibold border-b border-slate-700">
                        <tr>
                            <th class="px-6 py-4">Unité</th>
                            <th class="px-6 py-4">Compétence</th>
                            <th class="px-6 py-4 text-center">Priorité</th>
                            <th class="px-6 py-4 text-center">Action</th>
                            <th class="px-6 py-4 text-center">Suppr.</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/60">
                        <!-- Boucle sécurisée -->
                        <tr th:each="p : ${plans}" class="hover:bg-slate-750/50 transition-colors" th:if="${plans != null}">
                            <td class="px-6 py-4 font-bold text-white" th:text="${p.nomUnite}"></td>
                            <td class="px-6 py-4 text-slate-300" th:text="${p.nomSkill}"></td>
                            
                            <!-- Formulaire de modification -->
                            <form th:action="@{/omicron-tw/modifier/{id}(id=${p.id})}" method="post">
                                <td class="px-6 py-4 text-center">
                                    <select name="priorite" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                                        <option th:each="opt : ${prioriteOptions}" th:value="${opt}" th:text="'P' + ${opt}" th:selected="${opt == p.priorite}"></option>
                                    </select>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <button type="submit" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition-colors shadow-sm">
                                        Actualiser
                                    </button>
                                </td>
                            </form>

                            <!-- Formulaire de suppression -->
                            <td class="px-6 py-4 text-center">
                                <form th:action="@{/omicron-tw/supprimer/{id}(id=${p.id})}" method="post" class="inline">
                                    <button type="submit" class="p-2 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-lg transition-colors" title="Supprimer" onclick="return confirm('Supprimer cette entrée ?');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <!-- Message si aucune donnée ou si la liste est nulle -->
                        <tr th:if="${plans == null or #lists.isEmpty(plans)}">
                            <td colspan="5" class="px-6 py-8 text-center text-slate-500">
                                Aucun omicron enregistré dans le plan pour le moment.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
