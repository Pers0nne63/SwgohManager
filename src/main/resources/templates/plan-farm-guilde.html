<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans de Farm - Guilde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { slate: { 850: '#152032', 950: '#0b1329' } } }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <div th:replace="~{fragments/fragments :: navbar}"></div>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8 max-w-7xl">
        <a href="/guilde" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-amber-400 mb-6 transition-colors">
            <i class="bi bi-arrow-left me-2"></i> Retour à la guilde
        </a>

        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i class="bi bi-journal-check text-amber-400"></i> Suivi des Plans de Farm
            </h1>
        </div>

        <!-- Table des joueurs -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="bi bi-bar-chart-line text-amber-400"></i> Progression par membre
                </h2>
                <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-bold" th:text="${#lists.size(joueurs)} + ' joueurs'">0 joueurs</span>
            </div>

            <div class="overflow-x-auto">
                <table id="planFarmTable" class="w-full min-w-[900px] table-fixed text-left text-sm text-slate-300">
                    <colgroup>
                        <col class="w-[22%]">
                        <col class="w-[13%]">
                        <col class="w-[24%]">
                        <col class="w-[24%]">
                        <col class="w-[17%]">
                    </colgroup>
                    <thead class="bg-slate-850 text-slate-400 uppercase text-xs font-semibold border-b border-slate-700 select-none">
                        <tr>
                            <th onclick="sortTable(0, 'text')" class="px-4 py-2.5 cursor-pointer hover:text-amber-400 transition-colors">
                                Joueur <i class="bi bi-arrow-down-up ms-1 text-xs opacity-60"></i>
                            </th>
                            <th onclick="sortTable(1, 'number')" class="px-4 py-2.5 cursor-pointer hover:text-amber-400 transition-colors">
                                Puissance Galactique <i class="bi bi-arrow-down-up ms-1 text-xs opacity-60"></i>
                            </th>
                            <th onclick="sortTable(2, 'number')" class="px-4 py-2.5 cursor-pointer hover:text-amber-400 transition-colors">
                                Plan commun <i class="bi bi-arrow-down-up ms-1 text-xs opacity-60"></i>
                            </th>
                            <th onclick="sortTable(3, 'number')" class="px-4 py-2.5 cursor-pointer hover:text-sky-400 transition-colors">
                                Plan individuel <i class="bi bi-arrow-down-up ms-1 text-xs opacity-60"></i>
                            </th>
                            <th class="px-4 py-2.5 text-center">Détails</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/60">
                        <tr th:each="j : ${joueurs}" class="hover:bg-slate-750/50 transition-colors"
                            th:with="pctC=${pourcentagesCommun != null ? pourcentagesCommun[j.playerId] : null},
                                     pctI=${pourcentagesInd != null ? pourcentagesInd[j.playerId] : null}">

                            <!-- Joueur -->
                            <td class="px-4 py-1.5 font-bold text-white truncate" th:data-sort="${j.playerName}">
                                <a th:href="@{/joueur/{id}(id=${j.playerId})}" class="hover:text-amber-400 transition-colors" th:text="${j.playerName}">Nom Joueur</a>
                            </td>

                            <!-- PG -->
                            <td class="px-4 py-1.5 text-slate-400 whitespace-nowrap"
                                th:data-sort="${j.galacticPower != null ? j.galacticPower : 0}"
                                th:text="${#numbers.formatInteger(j.galacticPower, 0, 'WHITESPACE')} + ' PG'">0 PG</td>

                            <!-- Progression plan commun -->
                            <td class="px-4 py-1.5" th:data-sort="${pctC != null ? pctC : -1}">
                                <div th:if="${pctC != null}" class="flex items-center gap-3">
                                    <div class="flex-1 bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700/60">
                                        <div class="bg-gradient-to-r from-amber-500 to-yellow-400 h-full rounded-full transition-all duration-300"
                                             th:style="'width: ' + ${pctC} + '%'"></div>
                                    </div>
                                    <span class="font-bold text-amber-400 text-xs w-14 shrink-0 text-right whitespace-nowrap" th:text="${#numbers.formatDecimal(pctC, 1, 1) + ' %'}">0 %</span>
                                </div>
                                <span th:if="${pctC == null}" class="text-xs text-slate-500 italic flex items-center gap-1.5 whitespace-nowrap">
                                    <i class="bi bi-dash-circle"></i> Aucune donnée
                                </span>
                            </td>

                            <!-- Progression plan individuel -->
                            <td class="px-4 py-1.5" th:data-sort="${pctI != null ? pctI : -1}">
                                <div th:if="${pctI != null}" class="flex items-center gap-3">
                                    <div class="flex-1 bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700/60">
                                        <div class="bg-gradient-to-r from-sky-500 to-cyan-400 h-full rounded-full transition-all duration-300"
                                             th:style="'width: ' + ${pctI} + '%'"></div>
                                    </div>
                                    <span class="font-bold text-sky-400 text-xs w-14 shrink-0 text-right whitespace-nowrap" th:text="${#numbers.formatDecimal(pctI, 1, 1) + ' %'}">0 %</span>
                                </div>
                                <span th:if="${pctI == null}" class="text-xs text-slate-500 italic flex items-center gap-1.5 whitespace-nowrap">
                                    <i class="bi bi-dash-circle"></i> Aucun plan défini
                                </span>
                            </td>

                            <!-- Actions -->
                            <td class="px-4 py-1.5">
                                <div class="flex items-center justify-center gap-1.5">
                                    <a th:href="@{/joueur/{id}/plan-farm(id=${j.playerId})}"
                                       title="Détails du plan de farm commun"
                                       class="inline-flex items-center gap-1 px-2.5 py-1 bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 border border-amber-500/30 rounded-lg text-xs font-bold transition-all">
                                        <i class="bi bi-people-fill"></i> Commun
                                    </a>
                                    <a th:href="@{/web/plan-farm-ind/joueur/{id}(id=${j.playerId})}"
                                       title="Gérer le plan de farm individuel"
                                       class="inline-flex items-center gap-1 px-2.5 py-1 bg-sky-500/10 hover:bg-sky-500 text-sky-400 hover:text-slate-950 border border-sky-500/30 rounded-lg text-xs font-bold transition-all">
                                        <i class="bi bi-person-fill"></i> Individuel
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let currentSortColumn = -1;
        let currentSortAsc = true;

        function sortTable(columnIndex, type) {
            const table = document.getElementById("planFarmTable");
            if (!table) return;

            const tbody = table.querySelector("tbody");
            const rows = Array.from(tbody.querySelectorAll("tr"));

            if (currentSortColumn === columnIndex) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortColumn = columnIndex;
                currentSortAsc = true;
            }

            rows.sort((a, b) => {
                const cellA = a.children[columnIndex];
                const cellB = b.children[columnIndex];

                let valA = cellA.getAttribute("data-sort") || cellA.innerText.trim();
                let valB = cellB.getAttribute("data-sort") || cellB.innerText.trim();

                if (type === 'number') {
                    let numA = parseFloat(valA);
                    let numB = parseFloat(valB);
                    if (isNaN(numA)) numA = -1;
                    if (isNaN(numB)) numB = -1;
                    return currentSortAsc ? numA - numB : numB - numA;
                } else {
                    return currentSortAsc
                        ? valA.localeCompare(valB, 'fr', { sensitivity: 'base' })
                        : valB.localeCompare(valA, 'fr', { sensitivity: 'base' });
                }
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        // Tri automatique par joueur (A -> Z) au chargement de la page
        document.addEventListener("DOMContentLoaded", () => {
            sortTable(0, 'text');
        });
    </script>
</body>
</html>
